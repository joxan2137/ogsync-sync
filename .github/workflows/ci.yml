name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Installs the toolchain pinned in rokit.toml (rojo 7.5.1, lune 0.10.5).
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      - name: Plugin tests
        run: bun run test:plugin

      - name: Build plugin
        run: |
          mkdir -p dist
          bun run build:plugin
